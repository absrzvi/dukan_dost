services:
  - type: web
    name: dukaan-dost-api
    env: python
    region: singapore  # Closest to Pakistan
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: dukaan-dost-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: dukaan-dost-api.onrender.com
      - key: PYTHON_VERSION
        value: 3.11.0

databases:
  - name: dukaan-dost-db
    databaseName: dukaan_dost
    user: dukaan_dost
    plan: free
    region: singapore
